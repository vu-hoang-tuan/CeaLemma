name = "CeaLemma"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CeaLemma"]
requiresModuleSystem = true
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Cea"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = true
weak.linter.style.longFile = 1500
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Mathlib master snapshot, 2026-10-12; its toolchain is v4.35.0-rc4.
rev = "dde65624ecc7ebb09c14a4c2d5a13bedc94c939c"

[[lean_lib]]
name = "Cea"
srcDir = "Mathlib/Analysis/Normed/Operator"

[[lean_lib]]
name = "CeaLemma"
